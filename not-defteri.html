<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTMATİK | Hedef Defterim</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-bg: #8a0303;
            --nav-text: #ffffff;
            --accent: #ef233c;
            --bg: #f4f4f9;
            --card: #ffffff;
            --text: #0b090a;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        body.dark-mode {
            --primary-bg: #0b090a;
            --nav-text: #ef233c;
            --bg: #111111;
            --card: #161a1d;
            --text: #f8f9fa;
            --shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            transition: all 0.3s ease;
        }

        nav {
            background: var(--primary-bg);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo { color: var(--nav-text); font-weight: 900; font-size: 1.5em; text-decoration: none; }
        .nav-logo i { color: var(--accent); }

        .btn-back { 
            color: white; 
            border: 2px solid rgba(255,255,255,0.2); 
            padding: 8px 18px; 
            border-radius: 30px; 
            text-decoration: none; 
            font-size: 0.9em; 
            font-weight: 700;
            transition: 0.3s;
        }
        
        .btn-back:hover {
            background: rgba(255,255,255,0.1);
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Yeni Akıllı Panel */
        .smart-action-area {
            text-align: center;
            margin-bottom: 50px;
            padding: 40px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 2px dashed var(--accent);
        }

        .smart-action-area h2 { margin-top: 0; font-weight: 900; font-size: 2em; }
        .smart-action-area p { opacity: 0.7; font-size: 0.9em; margin-bottom: 25px; font-weight: 600; }

        .btn-smart-paste {
            background: var(--accent);
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.1em;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(239, 35, 60, 0.3);
        }

        .btn-smart-paste:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(239, 35, 60, 0.4);
            background: #d90429;
        }

        .course-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .course-card {
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            position: relative;
            border-top: 6px solid var(--accent);
            width: 100%;
            max-width: 350px;
            transition: 0.3s;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .course-card h3 { margin: 0 0 15px 0; color: var(--text); font-size: 1.2em; border-bottom: 2px solid var(--bg); padding-bottom: 10px; font-weight: 900; }

        .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .info-item label { display: block; font-size: 0.65em; color: #888; font-weight: 700; text-transform: uppercase; }
        .info-item span { font-weight: 700; font-size: 1.05em; }

        .target-box { background: var(--bg); padding: 15px; border-radius: 12px; text-align: center; border: 1px dashed rgba(239, 35, 60, 0.3); }
        .target-box label { display: block; font-size: 0.7em; font-weight: 600; opacity: 0.6; }
        .target-box b { font-size: 2em; color: var(--accent); display: block; margin-top: 5px; }

        .delete-btn { position: absolute; top: 15px; right: 15px; color: #ff5252; cursor: pointer; opacity: 0.3; transition: 0.3s; font-size: 1.2em; }
        .delete-btn:hover { opacity: 1; transform: scale(1.1); }

        .empty-state { text-align: center; padding: 60px 0; width: 100%; opacity: 0.4; font-weight: 700; }

        /* Footer */
        footer {
            background-color: #0b090a; color: #b0c2e3; padding: 25px 0; width: 100%;
            text-align: center; font-size: 0.85em; flex-shrink: 0; margin-top: auto;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo">NOTMATİK <i class="fa-solid fa-graduation-cap"></i></a>
    <a href="index.html" class="btn-back"><i class="fa-solid fa-calculator"></i> Hesaplayıcıya Dön</a>
</nav>

<div class="container">
    <div class="smart-action-area">
        <h2>Ders Not Defteri</h2>
        <p>Hesapladığın veriyi kopyaladıysan aşağıdaki butona basman yeterli.</p>
        <button class="btn-smart-paste" onclick="handleSmartPaste()">
            <i class="fa-solid fa-file-import"></i> PANODAN YAPIŞTIR VE EKLE
        </button>
    </div>

    <div id="courseList" class="course-grid">
        </div>
</div>

    <footer>
        <p>&copy; 2025 NOTMATİK. Tüm Hakları Saklıdır.</p>
        <p><b>halitguns06.dev</b> | Versiyon: 2.0</p>
    </footer>


<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Otomatik Dark Mode Tespiti
        const savedMode = localStorage.getItem('darkMode');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedMode === 'enabled' || (savedMode === null && prefersDark)) {
            document.body.classList.add('dark-mode');
        }
        loadCards();
    });

async function handleSmartPaste() {
    try {
        // 1. Panodaki metni oku
        const text = await navigator.clipboard.readText();
        
        // 2. Format kontrolü
        if (!text || !text.includes('|') || !text.startsWith('T:')) {
            alert("Panoda geçerli bir Notmatik verisi bulunamadı!");
            return;
        }

        // 3. Ders adını al
        const dersAdi = prompt("Dersin Adını Giriniz:");
        if (!dersAdi) return;

        // 4. Veriyi kaydet
        const newCourse = { id: Date.now(), name: dersAdi.toUpperCase(), data: text };
        const courses = JSON.parse(localStorage.getItem('savedGoals') || '[]');
        courses.unshift(newCourse);
        localStorage.setItem('savedGoals', JSON.stringify(courses));
        
        // 5. Kartları yenile
        loadCards();

        // 🔑 6. PANOYI TEMİZLE (İstediğin işlem burada yapılıyor)
        await navigator.clipboard.writeText(""); 
        
        alert("Ders başarıyla kaydedildi!");
        
    } catch (err) {
        alert("Pano erişim izni reddedildi.");
    }
}

function loadCards() {
    const list = document.getElementById('courseList');
    const courses = JSON.parse(localStorage.getItem('savedGoals') || '[]');
    
    if (courses.length === 0) {
        list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-clipboard-list fa-3x"></i><p>Henüz kayıtlı bir hedef bulunmuyor.</p></div>`;
        return;
    }

    list.innerHTML = courses.map(course => {
        const parts = {};
        course.data.split('|').forEach(p => { 
            const index = p.indexOf(':');
            if (index !== -1) {
                const k = p.substring(0, index);
                const v = p.substring(index + 1);
                parts[k] = v;
            }
        });

        let displayNote = "";
        if (parts.GS && parts.GS !== "") {
            displayNote = `
                <div style="margin-bottom:8px;">
                    <span style="font-size: 0.75em; display:block; opacity:0.6; font-weight:800;">HEDEF İÇİN</span>
                    <span style="color:var(--accent); font-size:1.8em; font-weight:900;">${parts.GH}</span>
                </div>
                <div style="border-top: 1px dashed rgba(0,0,0,0.1); padding-top:8px;">
                    <span style="font-size: 0.75em; display:block; opacity:0.6; font-weight:800; color:#f48c06;">ŞARTLI (${parts.SALT}) İÇİN</span>
                    <span style="color:#f48c06; font-size:1.5em; font-weight:900;">${parts.GS}</span>
                </div>
            `;
        } else {
            displayNote = `
                <span style="font-size: 0.75em; display:block; opacity:0.6; font-weight:800;">GEREKEN FİNAL NOTU</span>
                <span style="color:var(--accent); font-size:2.5em; font-weight:900;">${parts.GH || '-'}</span>
            `;
        }

        return `
            <div class="course-card">
                <i class="fa-solid fa-trash-can delete-btn" onclick="deleteItem(${course.id})"></i>
                <h3 style="border-bottom: 2px solid var(--bg); padding-bottom:10px;">${course.name}</h3>
                <div class="grid-info" style="display: flex; justify-content: space-around; padding: 10px 0; gap: 5px;">
                    <div class="info-item" style="text-align:center;">
                        <label style="display:block; font-size:0.6rem; color:#888; font-weight:800;">VİZE (%${parts.VA || '0'})</label>
                        <span style="font-weight:900; font-size:1.1em;">${parts.V || '-'}</span>
                    </div>
                    
                    ${parts.P ? `
                    <div class="info-item" style="text-align:center;">
                        <label style="display:block; font-size:0.6rem; color:#888; font-weight:800;">PROJE (%${parts.PA})</label>
                        <span style="font-weight:900; font-size:1.1em;">${parts.P}</span>
                    </div>` : ''}

                    <div class="info-item" style="text-align:center;">
                        <label style="display:block; font-size:0.6rem; color:#888; font-weight:800;">HEDEF</label>
                        <span style="font-weight:900; font-size:1.1em;">${parts.H || '-'}</span>
                    </div>
                </div>
                <div class="target-box" style="background:var(--bg); padding:12px; border-radius:12px; text-align:center; margin-top:10px;">
                    ${displayNote}
                </div>
            </div>
        `;
    }).join('');
}


function deleteItem(id) {
        if (confirm('Dersi silmek istediğine emin misin?')) {
            let courses = JSON.parse(localStorage.getItem('savedGoals') || '[]');
            courses = courses.filter(c => c.id !== id);
            localStorage.setItem('savedGoals', JSON.stringify(courses));
            loadCards();
        }
    }
</script>

</body>
</html>
